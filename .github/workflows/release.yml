name: Publish reviewed tag
on: workflow_dispatch
permissions: {}
jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !github.event.repository.private
    runs-on: macos-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Verify reviewed revision and version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/check-pack.mjs
      - run: bash scripts/scan-release.sh
      - run: npm publish ./*.tgz --ignore-scripts --access public --provenance
