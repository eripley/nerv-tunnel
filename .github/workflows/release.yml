name: Publish reviewed tag
on: workflow_dispatch
permissions: {}

jobs:
  build:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !github.event.repository.private
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  verify:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !github.event.repository.private
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify reviewed revision and version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@v4
        with:
          name: verified-npm-package
          path: verified-package
      - name: Publish verified archive
        run: npm publish ./verified-package/*.tgz --ignore-scripts --access public --provenance
