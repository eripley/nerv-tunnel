name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
permissions:
  contents: read

jobs:
  test:
    name: Verify CLI
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - name: Check TypeScript
        run: npm run typecheck
      - name: Compile CLI
        run: npm run build
      - name: Lint with Airbnb rules
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run tests with line coverage
        run: npm run test:coverage
      - name: Check README coverage badge
        run: git diff --exit-code -- docs/coverage.svg
      - name: Keep coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cli-line-coverage
          path: coverage/lcov.info
          if-no-files-found: error
      - name: Pack, inspect and install CLI
        run: npm run check:pack
      - name: Scan commit history and extracted npm archive
        run: bash scripts/scan-release.sh
      - name: Keep verified tarball for publication
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: verified-npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1
