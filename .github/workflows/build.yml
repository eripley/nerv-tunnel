name: Build
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Compile CLI
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and start CLI on the minimum supported Node version
        run: |
          npm run build
          node dist/cli.js --help
