<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="496" viewBox="0 0 1000 496" role="img" aria-labelledby="title desc">
  <title id="title">Three independent reverse SSH tunnels</title>
  <desc id="desc">NERV opens a separate SSH connection to each of three VPS hosts running Claude Code, Codex and Kimi. On each host, ssh nerv uses a loopback forward through its own connection to reach NERV.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#26303c" stroke-width="1"/></pattern>
    <pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 12 12-2" fill="none" stroke="#ff6549" stroke-width="4"/></pattern>
    <marker id="out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff9169"/></marker>
    <marker id="in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#76e3ba"/></marker>
  </defs>
  <rect width="1000" height="496" rx="14" fill="#10141c"/>
  <rect x="12" y="12" width="976" height="472" rx="6" fill="url(#grid)"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <path fill="#ff6549" d="M34 35h5v10h-5Z M39 40h5v5h-5Z M54 35h5v10h-5Z M69 35h5v10h-5Z M74 35h5v5h-5Z M79 35h5v5h-5Z M84 35h5v5h-5Z M99 35h5v10h-5Z M104 35h5v5h-5Z M109 35h5v5h-5Z M114 35h5v10h-5Z M129 35h5v10h-5Z M149 35h5v10h-5Z M34 45h5v10h-5Z M44 45h5v5h-5Z M49 50h5v5h-5Z M54 45h5v10h-5Z M69 45h5v10h-5Z M74 45h5v5h-5Z M79 45h5v5h-5Z M99 45h5v10h-5Z M104 45h5v5h-5Z M109 45h5v10h-5Z M114 45h5v5h-5Z M134 45h5v10h-5Z M144 45h5v10h-5Z M34 55h5v10h-5Z M54 55h5v10h-5Z M69 55h5v10h-5Z M74 60h5v5h-5Z M79 60h5v5h-5Z M84 60h5v5h-5Z M99 55h5v10h-5Z M114 55h5v10h-5Z M139 55h5v10h-5Z"/>
    <text x="188" y="60" font-size="23" font-weight="bold" letter-spacing="2" fill="#ebeff5">REVERSE SSH LINKS</text>
    <rect x="844" y="42" width="122" height="17" fill="url(#stripe)"/>
    <path d="M34 84H966" stroke="#63768d"/>
    <path d="M34 111H303L323 131V356H34Z" stroke="#63768d" stroke-width="2" fill="#181f2a"/>
    <text x="59" y="160" fill="#ffc46b" font-size="34" font-weight="bold">NERV</text>
    <text x="59" y="190" fill="#dde5ee" font-size="19">Primary machine</text>
    <path d="M59 216H297" stroke="#63768d"/>
    <text x="59" y="254" fill="#ff9169" font-size="18">SSH clients · launchd</text>
    <text x="59" y="289" fill="#76e3ba" font-size="18">SSH listener · sshd</text>
    <text x="59" y="330" fill="#b4c0d0" font-size="16">Projects and files</text>
    <g transform="translate(0 108)">
      <path d="M323 27H667" stroke="#ff9169" stroke-width="3" marker-end="url(#out)"/>
      <path d="M673 49H329" stroke="#76e3ba" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#in)"/>
      <path d="M673 0H950L966 16V72H673Z" stroke="#63768d" stroke-width="2" fill="#181f2a"/>
      <text x="693" y="30" fill="#ffc46b" font-size="22" font-weight="bold">EVA-A</text>
      <text x="944" y="29" fill="#b4c0d0" text-anchor="end" font-size="15">VPS 1</text>
      <text x="693" y="57" fill="#dde5ee" font-size="18">Claude Code</text>
    </g>
    <g transform="translate(0 198)">
      <path d="M323 27H667" stroke="#ff9169" stroke-width="3" marker-end="url(#out)"/>
      <path d="M673 49H329" stroke="#76e3ba" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#in)"/>
      <path d="M673 0H950L966 16V72H673Z" stroke="#63768d" stroke-width="2" fill="#181f2a"/>
      <text x="693" y="30" fill="#ffc46b" font-size="22" font-weight="bold">EVA-B</text>
      <text x="944" y="29" fill="#b4c0d0" text-anchor="end" font-size="15">VPS 2</text>
      <text x="693" y="57" fill="#dde5ee" font-size="18">Codex</text>
    </g>
    <g transform="translate(0 288)">
      <path d="M323 27H667" stroke="#ff9169" stroke-width="3" marker-end="url(#out)"/>
      <path d="M673 49H329" stroke="#76e3ba" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#in)"/>
      <path d="M673 0H950L966 16V72H673Z" stroke="#63768d" stroke-width="2" fill="#181f2a"/>
      <text x="693" y="30" fill="#ffc46b" font-size="22" font-weight="bold">EVA-C</text>
      <text x="944" y="29" fill="#b4c0d0" text-anchor="end" font-size="15">VPS 3</text>
      <text x="693" y="57" fill="#dde5ee" font-size="18">Kimi</text>
    </g>
    <path d="M34 384H966" stroke="#63768d"/>
    <path d="M34 415H92" stroke="#ff9169" stroke-width="3" marker-end="url(#out)"/>
    <text x="110" y="421" fill="#dde5ee" font-size="17">NERV opens an SSH tunnel to each VPS</text>
    <path d="M92 451H34" stroke="#76e3ba" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#in)"/>
    <text x="110" y="457" fill="#dde5ee" font-size="17">On each EVA, ssh nerv returns through that tunnel</text>
  </g>
</svg>
