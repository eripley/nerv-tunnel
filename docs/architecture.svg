<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="432" viewBox="0 0 1000 432" role="img" aria-labelledby="title desc">
  <title id="title">NERV reverse SSH link</title>
  <desc id="desc">On the Mac, launchd runs the SSH client and NERV observes its process. The Mac opens an SSH connection to the EVA. An SSH client on the EVA connects to a loopback port forwarded through that connection to the Mac SSH listener.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#26303c" stroke-width="1"/></pattern>
    <pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 12 12-2" fill="none" stroke="#ff6549" stroke-width="4"/></pattern>
    <marker id="out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff9169"/></marker>
    <marker id="in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#76e3ba"/></marker>
  </defs>
  <rect width="1000" height="432" rx="14" fill="#10141c"/>
  <rect x="12" y="12" width="976" height="408" rx="6" fill="url(#grid)"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <path fill="#ff6549" d="M34 35h5v10h-5Z M39 40h5v5h-5Z M54 35h5v10h-5Z M69 35h5v10h-5Z M74 35h5v5h-5Z M79 35h5v5h-5Z M84 35h5v5h-5Z M99 35h5v10h-5Z M104 35h5v5h-5Z M109 35h5v5h-5Z M114 35h5v10h-5Z M129 35h5v10h-5Z M149 35h5v10h-5Z M34 45h5v10h-5Z M44 45h5v5h-5Z M49 50h5v5h-5Z M54 45h5v10h-5Z M69 45h5v10h-5Z M74 45h5v5h-5Z M79 45h5v5h-5Z M99 45h5v10h-5Z M104 45h5v5h-5Z M109 45h5v10h-5Z M114 45h5v5h-5Z M134 45h5v10h-5Z M144 45h5v10h-5Z M34 55h5v10h-5Z M54 55h5v10h-5Z M69 55h5v10h-5Z M74 60h5v5h-5Z M79 60h5v5h-5Z M84 60h5v5h-5Z M99 55h5v10h-5Z M114 55h5v10h-5Z M139 55h5v10h-5Z"/>
    <text x="188" y="60" font-size="23" font-weight="bold" letter-spacing="2" fill="#ebeff5">REVERSE SSH LINK</text>
    <rect x="844" y="42" width="122" height="17" fill="url(#stripe)"/>
    <path d="M34 84H966" stroke="#63768d"/>
    <path d="M34 108H277L297 128V343H34Z" stroke="#63768d" stroke-width="2" fill="#181f2a"/>
    <path d="M703 108H946L966 128V343H703Z" stroke="#63768d" stroke-width="2" fill="#181f2a"/>
    <g font-size="28" font-weight="bold" fill="#ffc46b"><text x="56" y="149">Mac</text><text x="725" y="149">EVA</text></g>
    <g fill="#dde5ee" font-size="20"><text x="56" y="207">SSH client</text><text x="725" y="207">SSH server</text><text x="56" y="292">SSH listener</text><text x="725" y="292">Return SSH alias</text></g>
    <g fill="#b4c0d0" font-size="15"><text x="56" y="232">owned by launchd</text><text x="725" y="232">remote account</text><text x="56" y="318">Mac user account</text><text x="725" y="318">EVA loopback port</text></g>
    <g fill="none" stroke-width="4"><path d="M297 200H697" stroke="#ff9169" marker-end="url(#out)"/><path d="M703 286H303" stroke="#76e3ba" stroke-dasharray="9 5" marker-end="url(#in)"/></g>
    <g text-anchor="middle" font-size="17" font-weight="bold"><text x="500" y="181" fill="#ff9169">Mac opens the tunnel</text><text x="500" y="267" fill="#76e3ba">EVA connects back inside it</text></g>
    <path d="M34 373H966" stroke="#63768d"/>
    <text x="34" y="401" fill="#bcabff" font-size="16" font-weight="bold">NERV TELEMETRY</text>
    <text x="215" y="401" fill="#d6dfe8" font-size="16">launchd PID   /   nettop RX + TX   /   round-trip SSH check</text>
  </g>
</svg>
